name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - "m0/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustc --version && cargo --version && git --version
      - name: Format working tree
        run: cargo fmt
      - name: Capture rustfmt patch
        run: git diff -- src tests > rustfmt.patch
      - uses: actions/upload-artifact@v4
        with:
          name: rustfmt-patch
          path: rustfmt.patch
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-targets --all-features
