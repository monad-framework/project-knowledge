name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - "m0/**"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustc --version && cargo --version && git --version
      - name: Format working tree
        run: cargo fmt
      - name: Commit rustfmt output
        if: github.event_name == 'push' && github.ref == 'refs/heads/m0/executable-kernel'
        run: |
          if git diff --quiet -- src tests; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "style: apply rustfmt"
          git push
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-targets --all-features
