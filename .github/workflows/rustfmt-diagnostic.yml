name: m0-diagnostic

on:
  push:
    branches:
      - "m0/**"

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: cargo fmt --check
      - name: Capture Clippy diagnostics
        shell: bash
        run: |
          set +e
          cargo clippy --all-targets --all-features -- -D warnings > clippy.log 2>&1
          echo $? > clippy.exit
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: clippy-diagnostic
          path: |
            clippy.log
            clippy.exit
