name: rustfmt-diagnostic

on:
  push:
    branches:
      - "m0/**"

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format working tree
        run: cargo fmt
      - name: Capture patch
        run: git diff -- src tests > rustfmt.patch
      - uses: actions/upload-artifact@v4
        with:
          name: rustfmt-patch
          path: rustfmt.patch
